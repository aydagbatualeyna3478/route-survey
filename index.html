<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<title>Route Survey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#111827;--mut:#4B5563;--line:#E1E5EA;--line2:#C7CED8;--navy:#1E3A5F;--navy2:#2B4C75;--red:#D7262E;--green:#1F7A3A;--okbg:#E8F5EC;--oktx:#1F6B35;--badbg:#FDECEC;--badtx:#B4232A;--warnbg:#FFF3D6;--warntx:#8A4B00;--sel:#DCE7F5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
/* top bar (16:9 tablet, landscape) */
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;min-height:68px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.bar h1{font-size:20px;margin:0;flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:48px;height:48px;margin-left:-12px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:inherit}
.cargo{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);padding-left:16px;min-width:220px}
.cargo b{font-size:14px}
.cargo .cg{display:grid;grid-template-columns:auto auto;column-gap:14px;font-size:12px;color:var(--mut)}
.cargo .cg span b{font-size:12px;color:var(--ink);font-weight:600}
/* two-pane body: each pane scrolls on its own */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding:20px}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.wide{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr)}
.pane{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.pane.box{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px}
.full{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.foot{background:var(--card);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:flex-end;flex-shrink:0}
.foot .btn{min-width:200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:12px 16px;min-height:52px;font-weight:600;font-size:15px;color:var(--navy);text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.grn{background:var(--okbg);color:var(--oktx);border-color:#9CCBA9}
.btn.dash{border-style:dashed;border-color:#8C9AAB;background:transparent}
.btn.grow{flex:1}
.btn.sm{min-height:42px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
label.f input,label.f textarea,label.f select{font-size:16px;color:var(--ink);padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;width:100%}
.hint{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:10px 16px;min-height:46px;font-size:15px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chip.dash{border-style:dashed;color:var(--navy);font-weight:600}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--oktx)}.tag.bad{background:var(--badbg);color:var(--badtx)}.tag.warn{background:var(--warnbg);color:var(--warntx)}
.tag.sub{background:var(--green);color:#fff;border-radius:4px}
/* obstacle list (survey screen) */
.rec{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid transparent;background:none;padding:6px;border-radius:12px}
.rec.on{border-color:var(--navy);background:var(--sel)}
.rec img,.rec .ph{width:132px;height:99px;border-radius:8px;object-fit:cover;background:#C9D2DC;flex-shrink:0;border:1px solid var(--line2)}
.rec .t{font-size:15px;font-weight:600}.rec .s{font-size:13px;color:var(--mut)}
.rec.sub img,.rec.sub .ph{width:104px;height:78px}
.subs{border-left:3px solid var(--green);margin-left:10px;padding-left:10px;display:flex;flex-direction:column;gap:4px}
.grp{border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;flex-direction:column;gap:4px}
/* round action buttons (survey screen) */
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.2vh,22px) 18px;justify-items:center;align-content:center;flex:1;min-height:0}
.rb{width:clamp(78px,16vh,124px);height:clamp(78px,16vh,124px);border-radius:50%;border:2px solid var(--line2);background:#fff;color:var(--navy);font-size:14px;font-weight:600;line-height:1.2;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.rb svg{flex-shrink:0}
.rb.red{background:var(--red);border-color:var(--red);color:#fff}
.rb.grn{background:var(--okbg);border-color:#9CCBA9;color:var(--oktx)}
.rb.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.rb:disabled{opacity:.4}
.rb.ghost{visibility:hidden}
.count{font-size:22px;font-weight:700}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.side .note{padding:8px 12px}
.photo{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#8FA3B8;container-type:inline-size;max-height:100%}
.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hrow{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;border:1px solid var(--line2);background:#fff}
.hrow.bad{background:var(--badbg);border-color:#F3B7B7}.hrow.ok{background:var(--okbg);border-color:#B9DCC2}
.hrow input{width:90px;padding:8px;border:1px solid var(--line2);border-radius:8px;font-size:16px;font-weight:600;background:#fff}
.hrow input.lab{width:60px}
.sw{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:6px 0;min-height:54px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sw.on{border:2px solid var(--navy)}
.sw i{width:38px;height:12px;border-radius:3px;border:1px solid #9CA3AF;display:block}
.gps{font-size:13px;display:inline-flex;align-items:center;gap:6px;background:#F3F5F8;border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.gps i{width:9px;height:9px;border-radius:50%;background:#9CA3AF}.gps.on i{background:#22A04B}.gps.bad i{background:#E5484D}
.note{border-radius:12px;padding:10px 12px;font-size:13px}
.note.g{background:#EAF4EC;border:1px solid #B9DCC2;color:#1F4D2B}.note.w{background:var(--warnbg);border:1px solid #F0D28A;color:var(--warntx)}
.logo{border:1px dashed #8C9AAB;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff;font-size:12px;color:var(--mut);cursor:pointer}
.logo .pv{height:60px;border-radius:6px;background:#F9FAFB;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:600;color:var(--navy)}
.logo .pv img{max-width:100%;max-height:100%}
.ov{position:absolute}.ov.sel{outline:2px dashed #fff;outline-offset:2px}
.hd{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:3px solid var(--red);touch-action:none}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:24px;bottom:24px;background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stat4 b{font-size:24px;display:block}.stat4 span{font-size:12px;color:var(--mut)}
input[type=file].hid{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-stage{display:flex;align-items:center;justify-content:center;min-height:0}
.photo-stage .photo{height:100%;width:auto;max-width:100%}
/* narrow screens / portrait: stack the panes */
@media (max-width:860px),(orientation:portrait) and (max-width:1000px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100%}
  .split,.split.even,.split.wide{display:flex;flex-direction:column;padding:16px}
  .pane,.side{overflow:visible}
  .acts{flex:none}
  .cargo{min-width:0}
  .acts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rb{width:96px;height:96px;font-size:12px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot .btn{min-width:0;flex:1}
  .photo-stage .photo{height:auto;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="db.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
