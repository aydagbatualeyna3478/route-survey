<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Survey Report</title>
<link rel="stylesheet" href="report2.css">
<style>
#tb{position:sticky;top:0;z-index:10;background:#1E3A5F;color:#fff;display:flex;gap:10px;align-items:center;padding:10px 12px;font:15px system-ui,sans-serif}
#tb button,#tb a{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;min-height:44px;background:#fff;color:#1E3A5F;text-decoration:none}
#tb span{flex:1;font-size:13px}
@media screen{#report{zoom:var(--z,1)}}
@media print{#tb{display:none}}
</style>
</head>
<body>
<div id="tb"><a id="bk" href="index.html">← Geri</a><span id="msg">Rapor hazırlanıyor…</span><button id="pr" disabled>PDF al / Yazdır</button></div>
<main id="report"></main>
<script src="db.js"></script>
<script src="rules.js"></script>
<script>
/* New report draft (Nov 2026): summary table, then every record — INFO and BYPASS too — on its own A4 landscape page:
   header (logos, project table, title band) · # / KM / obstacle / latitude & longitude / details above the photo ·
   photo on the left · on the right the obstacle's place on the whole route, remarks, and a close satellite view. */
(async () => {
  const id = location.hash.slice(1), msg = document.getElementById('msg');
  document.getElementById('bk').href = 'index.html#/rep/' + id;
  const sv = await DB.getSurvey(id);
  if (!sv) { msg.textContent = 'Etüt bulunamadı.'; return; }
  const P = sv.project, esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mp = Object.assign({ provider: 'esri', key: '' }, await DB.getSetting('maps'));
  const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  const routeLine = routeKm(sv);           // KM of every record from the final order
  const recs = orderedRecords(sv);          // archived records are left out
  const blobUrl = async bid => (await DB.blobUrl(bid)) || null;

  // ---------- photos: 1400×1050 JPEG with Excel's 2.5 pt soft edge baked in ----------
  async function reportPhoto(bid) {
    const blob = await DB.getBlob(bid); if (!blob) return null;
    let bmp; try { bmp = await createImageBitmap(blob); } catch (e) { return URL.createObjectURL(blob); }
    const W = 1400, H = 1050, c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    const k = Math.max(W / bmp.width, H / bmp.height), dw = bmp.width * k, dh = bmp.height * k;
    g.drawImage(bmp, (W - dw) / 2, (H - dh) / 2, dw, dh);
    const f = Math.round(W * 2.5 / 485);
    const fade = (x0, y0, x1, y1, rx, ry, rw, rh) => { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(rx, ry, rw, rh); };
    fade(0, 0, f, 0, 0, 0, f, H); fade(W, 0, W - f, 0, W - f, 0, f, H); fade(0, 0, 0, f, 0, 0, W, f); fade(0, H, 0, H - f, 0, H - f, W, f);
    return new Promise(res => c.toBlob(b => res(URL.createObjectURL(b)), 'image/jpeg', 0.74));
  }

  // ---------- maps ----------
  const MW = 932, MH = 400;   // pixels for a 275 × 118 pt map box
  const wx = (lon, n) => (lon + 180) / 360 * n, wy = (lat, n) => (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
  function tiles(g, z, x0, y0, W, H, url) {   // draws web-mercator tiles into a canvas; resolves true if any arrived
    const jobs = [];
    for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + W) / 256); tx++) for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + H) / 256); ty++) {
      const N = 2 ** z, X = ((tx % N) + N) % N;
      jobs.push(new Promise(res => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => { g.drawImage(i, tx * 256 - x0, ty * 256 - y0); res(true); }; i.onerror = () => res(false); i.src = url(z, X, ty); }));
    }
    return Promise.race([Promise.all(jobs), new Promise(res => setTimeout(() => res([]), 15000))]).then(a => a.some(Boolean));
  }
  const attrib = (g, W, H, t) => { g.font = '600 15px sans-serif'; const tw = g.measureText(t).width; g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(W - tw - 14, H - 24, tw + 14, 24); g.fillStyle = '#fff'; g.fillText(t, W - tw - 7, H - 7); };
  const pinAt = (g, x, y, s) => {   // red map pin with a white dot
    s = s || 1; g.save(); g.translate(x, y); g.scale(s, s);
    g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(-4, -10, -13, -14, -13, -24); g.arc(0, -24, 13, Math.PI, 0); g.bezierCurveTo(13, -14, 4, -10, 0, 0);
    g.fillStyle = '#E02424'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
    g.beginPath(); g.arc(0, -24, 5, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); g.restore();
  };
  const toUrl = c => new Promise(res => { try { c.toBlob(b => res(b ? URL.createObjectURL(b) : null), 'image/jpeg', 0.82); } catch (e) { res(null); } });
  const ESRI = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
  const OSM = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

  async function satellite(lat, lon) {   // close satellite view centred on the obstacle
    if (mp.provider === 'google') return `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=18&size=466x200&scale=2&maptype=satellite&markers=color:red%7C${lat},${lon}&key=${encodeURIComponent(mp.key)}`;
    const z = 18, n = 256 * 2 ** z, x0 = wx(lon, n) - MW / 2, y0 = wy(lat, n) - MH / 2;
    const c = document.createElement('canvas'); c.width = MW; c.height = MH; const g = c.getContext('2d'); g.fillStyle = '#C9D2DC'; g.fillRect(0, 0, MW, MH);
    if (!(await tiles(g, z, x0, y0, MW, MH, ESRI))) return null;
    pinAt(g, MW / 2, MH / 2, 1.3); attrib(g, MW, MH, 'Esri, Maxar, Earthstar Geographics');
    return toUrl(c);
  }
  // whole route: one base picture (tiles + blue route + start/end), the obstacle is marked on top of it per page
  let routeBase = null, routeProj = null;
  async function makeRouteBase() {
    if (routeLine.length < 2) return;
    const las = routeLine.map(p => p[0]), los = routeLine.map(p => p[1]), b = [Math.min(...las), Math.max(...las), Math.min(...los), Math.max(...los)];
    let z = 17, n; for (; z > 2; z--) { n = 256 * 2 ** z; if (wx(b[3], n) - wx(b[2], n) <= MW * 0.84 && wy(b[0], n) - wy(b[1], n) <= MH * 0.8) break; }
    n = 256 * 2 ** z;
    const x0 = (wx(b[2], n) + wx(b[3], n)) / 2 - MW / 2, y0 = (wy(b[0], n) + wy(b[1], n)) / 2 - MH / 2;
    routeProj = (lat, lon) => [wx(lon, n) - x0, wy(lat, n) - y0];
    if (mp.provider === 'google') return;
    const c = document.createElement('canvas'); c.width = MW; c.height = MH; const g = c.getContext('2d'); g.fillStyle = '#EEF1F4'; g.fillRect(0, 0, MW, MH);
    const ok = await tiles(g, z, x0, y0, MW, MH, OSM);
    g.lineJoin = g.lineCap = 'round';
    const path = () => { g.beginPath(); routeLine.forEach((p, i) => { const [x, y] = routeProj(p[0], p[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); };
    path(); g.strokeStyle = '#fff'; g.lineWidth = 9; g.stroke(); path(); g.strokeStyle = '#1E5AFF'; g.lineWidth = 5; g.stroke();
    const dot = (p, col) => { const [x, y] = routeProj(p[0], p[1]); g.beginPath(); g.arc(x, y, 8, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke(); };
    dot(routeLine[0], '#1F9D4C'); dot(routeLine[routeLine.length - 1], '#111');
    if (ok) attrib(g, MW, MH, '© OpenStreetMap contributors');
    routeBase = await toUrl(c);
  }
  function polyline(pts) {   // Google encoded polyline
    let out = '', plat = 0, plon = 0;
    const encN = v => { v = v < 0 ? ~(v << 1) : v << 1; let s = ''; while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
    for (const [la, lo] of pts) { const a = Math.round(la * 1e5), b = Math.round(lo * 1e5); out += encN(a - plat) + encN(b - plon); plat = a; plon = b; }
    return out;
  }
  function routeMap(r) {   // returns HTML for the route box
    if (routeLine.length < 2) return '<div class="none" style="width:100%;height:100%">No route data</div>';
    if (mp.provider === 'google') {
      const step = Math.max(1, Math.ceil(routeLine.length / 250)), pts = routeLine.filter((_, i) => i % step === 0 || i === routeLine.length - 1);
      let u = `https://maps.googleapis.com/maps/api/staticmap?size=466x200&scale=2&maptype=roadmap&path=color:0x1E5AFFFF%7Cweight:4%7Cenc:${encodeURIComponent(polyline(pts))}`;
      u += `&markers=size:tiny%7Ccolor:green%7C${pts[0][0]},${pts[0][1]}`;
      if (r.latDec != null) u += `&markers=color:red%7C${r.latDec},${r.lonDec}`;
      return `<img src="${u}&key=${encodeURIComponent(mp.key)}" alt="">`;
    }
    let pin = '';
    if (r.latDec != null && routeProj) { const [x, y] = routeProj(r.latDec, r.lonDec); pin = `<svg class="pin" viewBox="-13 -38 26 38" style="left:${x / MW * 100}%;top:${y / MH * 100}%;width:13pt;height:19pt;margin:-19pt 0 0 -6.5pt"><path d="M0 0C-4-10-13-14-13-24A13 13 0 0 1 13-24C13-14 4-10 0 0Z" fill="#E02424" stroke="#fff" stroke-width="2"/><circle cx="0" cy="-24" r="5" fill="#fff"/></svg>`; }
    return (routeBase ? `<img src="${routeBase}" alt="">` : '<div class="none" style="width:100%;height:100%">Map not available</div>') + pin;
  }

  // ---------- texts ----------
  const km1 = v => v == null ? '' : Number(v).toFixed(1);
  const num = v => v == null ? '' : String(Math.round(v * 100) / 100);
  function details(r) {
    const f = r.fields || {}, out = [];
    const hs = (r.heights || []).filter(h => h.value != null).map(h => `${h.label || 'H'} ${num(h.value)} m`);
    const ws = (r.widths || []).filter(w => w.value != null).map(w => `${w.label || 'W'} ${num(w.value)} m`);
    if (/^Overhead/.test(r.obstacle)) { if (f.type) out.push(`${r.obstacle === 'Overhead Cable' ? 'Line Type' : 'Structure Type'}: ${f.type}`); if (hs.length) out.push(`Height: ${hs.join(', ')}`); }
    else if (r.obstacle === 'Bridge') { if (f.type) out.push(`Bridge Type: ${f.type}`); if (f.name) out.push(`Bridge Name: ${f.name}`); if (f.spans) out.push(`Spans: ${f.spans}`); }
    else if (r.obstacle === 'Culvert') { if (f.type) out.push(`Culvert Type: ${f.type}`); if (f.spans) out.push(`Spans: ${f.spans}`); }
    else if (f.type) out.push(f.type);
    if (ws.length) out.push(`Width: ${ws.join(', ')}`);
    return out.join('  |  ') || '—';
  }
  const remarks = r => (/^Overhead/.test(r.obstacle) ? [r.actions, r.remarks] : [r.remarks, r.actions]).filter(Boolean).join('\n') || '—';
  const settings = { general: !!P.general, minHeight: P.minHeight, refLV: P.refLV, refMV: P.refMV, refHV: P.refHV };
  const COL = { red: '#FF0000', yellow: '#FFFF00', magenta: '#FF00FF', purple: '#7030A0', blue: '#4F81BD', green: '#92D050' };
  const route = `${P.start.name} - ${P.end.name} Arası Yol Etüdü`;
  const project = P.projectName || P.client || route;

  // ---------- assets ----------
  msg.textContent = 'Logolar ve fotoğraflar hazırlanıyor…';
  const L = logosOf(sv);
  const logoCompany = (await blobUrl(await DB.getSetting('companyLogo'))) || 'assets/logo_company.jpg';
  const headLogos = [logoCompany, await blobUrl(L.ids.client1), await blobUrl(L.ids.client2)].filter(Boolean);
  const ownerLogo = await blobUrl(L.ids.owner);
  let done = 0;
  for (const r of recs) { r.photo = await reportPhoto(r.photoId); done++; if (done % 10 === 0) msg.textContent = `Fotoğraflar hazırlanıyor… ${done} / ${recs.length}`; }
  msg.textContent = 'Haritalar hazırlanıyor…';
  await makeRouteBase();
  done = 0;
  for (const r of recs) { r.sat = r.latDec != null ? await satellite(r.latDec, r.lonDec) : null; done++; if (done % 5 === 0) msg.textContent = `Uydu görüntüleri… ${done} / ${recs.length}`; }

  // ---------- pages ----------
  const header = title => `<div class="a logos ${headLogos.length > 2 ? 'n3' : ''}">${headLogos.map(s => `<img src="${s}" alt="">`).join('')}</div>
    <table class="a info"><colgroup><col style="width:140pt"><col style="width:158pt"><col style="width:114pt"><col></colgroup>
      <tr><td class="l">Müşteri / Client</td><td>${esc(P.client)}</td><td class="l">Tarih / Date</td><td>${esc(P.reportDate || '')}</td></tr>
      <tr><td class="l">Proje / Project</td><td>${esc(P.projectName || '')}</td><td class="l">Doküman No / Doc. No</td><td>${esc(P.docNo || '')}</td></tr>
      <tr><td class="l">Güzergah / Route</td><td>${esc(route)}</td><td class="l">Revizyon No / Rev. No</td><td>${esc(P.rev || '')}</td></tr>
      <tr><td class="l">Ülke / Country</td><td>${esc(P.country || '')}</td><td class="l">Revizyon Tarihi / Date</td><td>${esc(P.revDate || '')}</td></tr></table>
    <div class="a title">${esc(title)}</div>`;
  const footer = () => `<div class="a owner">${ownerLogo ? `<img src="${ownerLogo}" alt="">` : ''}</div>
    <div class="a conf">Bu doküman gizlidir; izinsiz çoğaltılamaz ve üçüncü kişilerle paylaşılamaz.<br>Confidential – not to be copied or disclosed without permission.</div><div class="a pno"></div>`;
  let html = '';
  // summary
  const ROWS = 24;
  for (let i = 0; i < recs.length || i === 0; i += ROWS) {
    const rows = recs.slice(i, i + ROWS).map(r => `<tr class="${r.parentId ? 'sub' : ''}"><td>${esc(r.no)}</td><td>${km1(r.km)}</td><td>${esc(r.obstacle || (r.flag === 'INFO' ? 'Info' : ''))}${r.flag && r.obstacle !== 'Info' ? ` (${r.flag})` : ''}</td><td>${esc(remarks(r).replace(/\n/g, ' ').replace(/^—$/, ''))}</td></tr>`).join('');
    html += `<section class="pg">${header(`${project} — OBSTACLE SUMMARY`)}<table class="a sum"><colgroup><col style="width:42pt"><col style="width:48pt"><col style="width:190pt"><col></colgroup><tr><th>#</th><th>KM</th><th>OBSTACLE</th><th>NOTES</th></tr>${rows}</table>${footer()}</section>`;
  }
  // one page per record
  for (const r of recs) {
    const col = window.SurveyRules.highlightOf(r, settings), bg = col && COL[col] ? COL[col] : null;
    const ll = r.latDec != null ? `<a href="https://www.google.com/maps/search/?api=1&query=${r.latDec},${r.lonDec}">${esc(r.lat)}, ${esc(r.lon)}</a>` : '—';
    html += `<section class="pg">${header(`ROUTE SURVEY REPORT, ${project}`)}
      <table class="a strip"><colgroup><col style="width:44pt"><col style="width:52pt"><col style="width:170pt"><col style="width:170pt"><col></colgroup>
        <tr><th>#</th><th>KM</th><th>OBSTACLE</th><th>LATITUDE &amp; LONGITUDE</th><th>DETAILS</th></tr>
        <tr><td>${esc(r.no)}</td><td>${km1(r.km)}</td><td>${esc(r.obstacle || (r.flag === 'INFO' ? 'Info' : '—'))}${r.flag ? `<span class="flag">${r.flag}</span>` : ''}</td><td class="ll">${ll}</td><td class="det">${esc(details(r))}</td></tr></table>
      <div class="a photo">${r.photo ? `<img src="${r.photo}" alt="">${annHtml(r.ann || [], -1)}` : `<div class="none" style="width:100%;height:100%">No photo</div>`}</div>
      <div class="a map route">${routeMap(r)}<span class="lbl">ROUTE</span></div>
      <div class="a rmh">REMARKS</div>
      <div class="a rmb" style="${bg ? `background:${bg};${col === 'purple' || col === 'blue' ? 'color:#fff;' : ''}` : ''}">${esc(remarks(r))}</div>
      <div class="a map sat">${r.sat ? `<img src="${r.sat}" alt="">` : `<div class="none" style="width:100%;height:100%">${r.latDec == null ? 'No location data' : 'Satellite image not available'}</div>`}</div>
      ${footer()}</section>`;
  }
  const root = document.getElementById('report'); root.innerHTML = html;
  const pages = root.querySelectorAll('.pg'); pages.forEach((p, i) => { p.querySelector('.pno').textContent = `${i + 1} / ${pages.length}`; });
  document.title = `Route Survey Report - ${route}`;
  msg.textContent = 'Görseller yükleniyor…';
  await Promise.all(['400 10pt "DejaVu Sans"', '700 10pt "DejaVu Sans"'].map(f => document.fonts.load(f)));
  await Promise.race([Promise.all([...document.images].map(i => i.complete ? null : new Promise(res => { i.onload = i.onerror = res; }))), new Promise(res => setTimeout(res, 30000))]);
  // long texts shrink to fit their boxes
  root.querySelectorAll('.rmb, .strip td.det').forEach(el => { let s = parseFloat(getComputedStyle(el).fontSize); while (el.scrollHeight > el.clientHeight + 1 && s > 5) { s -= 0.4; el.style.fontSize = s + 'px'; } });
  const fit = () => document.documentElement.style.setProperty('--z', Math.min(1, (document.documentElement.clientWidth - 16) / 1123));
  fit(); window.addEventListener('resize', fit);
  window.REPORT_STATS = { pages: pages.length };
  msg.textContent = `${pages.length} sayfa hazır. Yazıcı olarak "PDF olarak kaydet" seç, kenar boşluklarını "Yok" yap.`;
  const pr = document.getElementById('pr'); pr.disabled = false; pr.onclick = () => window.print();
})().catch(e => { document.getElementById('msg').textContent = 'Hata: ' + e.message; console.error(e); });
</script>
</body>
</html>
